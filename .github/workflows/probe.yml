name: Probe sources (test branch only)
on:
  push:
    branches: [nightly-test]
    paths: [tools/probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
      - run: SKIP_LIT=1 node tools/probe/probe.mjs
      - run: node tools/probe/lit3.mjs || true
      - run: node tools/probe/lit4.mjs || true
      - uses: actions/upload-artifact@v4
        with: { name: fulltext, path: fulltext/, if-no-files-found: ignore, retention-days: 7 }
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe samples" && git pull --rebase origin nightly-test && git push origin HEAD:nightly-test
