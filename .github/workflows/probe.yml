name: Probe sources (test branch only)
on:
  push:
    branches: [nightly-test]
    paths: [tools/probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
      - run: node tools/probe/probe.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe samples" && git pull --rebase origin nightly-test && git push origin HEAD:nightly-test
