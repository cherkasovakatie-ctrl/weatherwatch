name: Paper event diagnostics (branch weekly-raw)
on:
  push:
    branches: [weekly-raw]
    paths: [tools/papers/trigger.txt]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy
      - name: Diagnostics
        run: |
          set -a; . tools/papers/trigger.txt; set +a
          mkdir -p "$OUT"
          [ -n "$SKIP_EXTRAS" ] || python3 tools/papers/event_extras.py > "$OUT/extras_stdout.txt" 2>&1 || true
          python3 tools/papers/event_diag.py > "$OUT/diag_stdout.txt" 2>&1 || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw && git commit -m "Paper diagnostics output" && git pull --rebase origin weekly-raw && git push origin HEAD:weekly-raw
