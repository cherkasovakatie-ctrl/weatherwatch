name: Paper reference check (branch weekly-raw)
on:
  push:
    branches: [weekly-raw]
    paths: [tools/papers/refs_trigger.txt]
permissions:
  contents: write
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          . tools/papers/refs_trigger.txt
          python3 tools/papers/refcheck.py "$TAG" > /tmp/refs_stdout.txt 2>&1 || true
          mkdir -p raw/papers/$TAG; cp /tmp/refs_stdout.txt raw/papers/$TAG/refs_stdout.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw && git commit -m "Paper reference check" && git pull --rebase origin weekly-raw && git push origin HEAD:weekly-raw
