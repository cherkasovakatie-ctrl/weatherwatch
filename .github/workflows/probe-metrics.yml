name: Probe metric sources (branch weekly-raw)
on:
  push:
    branches: [weekly-raw]
    paths: [tools/weekly/probe_metrics.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/weekly/probe_metrics.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw && git commit -m "Probe metric sources" && git pull --rebase origin weekly-raw && git push origin HEAD:weekly-raw
