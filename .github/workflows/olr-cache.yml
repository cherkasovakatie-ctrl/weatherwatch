name: OLR CDR cache (branch weekly-raw)
on:
  push:
    branches: [weekly-raw]
    paths: [tools/papers/olr_trigger.txt]
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        years: ['1979 1980 1981 1982', '1983 1984 1985 1986', '1987 1988 1989 1990', '1991 1992 1993 1994', '1995 1996 1997 1998', '1999 2000 2001 2002', '2003 2004 2005 2006', '2007 2008 2009 2010', '2011 2012 2013 2014', '2015 2016 2017 2018', '2019 2020 2021 2022', '2023 2024 2025 2026']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy xarray netCDF4
      - run: python3 tools/papers/olr_cache.py ${{ matrix.years }} | tee -a olr_log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p raw/olr_cdr; cat olr_log.txt >> "raw/olr_cdr/log_$(echo '${{ matrix.years }}' | cut -c1-4).txt" || true
          git add raw/olr_cdr && git commit -m "OLR cache ${{ matrix.years }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase origin weekly-raw && git push origin HEAD:weekly-raw && break; sleep $((RANDOM % 20 + 5)); done
