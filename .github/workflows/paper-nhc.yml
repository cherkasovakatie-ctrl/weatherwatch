name: Paper NHC discussions (branch weekly-raw)
on:
  push:
    branches: [weekly-raw]
    paths: [tools/papers/nhc_trigger.txt]
permissions:
  contents: write
jobs:
  nhc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mkdir -p raw/papers/nhc; python3 -u tools/papers/nhc_text.py TRUDY SIMON RACHEL ISAIAS NOLO POLO ODALYS LOWELL MARIE KARINA LALA GENEVIEVE FAUSTO > raw/papers/nhc/stdout.txt 2>&1 || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/papers/nhc && git commit -m "NHC discussions 2026" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin weekly-raw && git push origin HEAD:weekly-raw && break; sleep 15; done
