name: ERA5 equatorial winds (Copernicus CDS)

# Fetches ERA5 zonal wind for 10°S–10°N, 1979–2001, one year at a time; each reduced year is committed as soon as it
# arrives (data/papers/1982/era5_years/), so a run that hits the time limit loses nothing and re-dispatches itself.
# When all years are present it assembles the band file and re-tests the 1982 westerly-wind-burst list.
# Needs the repository secret CDSAPI_KEY. Shares the "cds" concurrency group with the CMIP6 job so the two never compete
# for the CDS request queue.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/era5/trigger.txt]

permissions:
  contents: write
  actions: write

concurrency:
  group: cds
  cancel-in-progress: false

jobs:
  era5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check the CDS key is set
        env: { CDSAPI_KEY: '${{ secrets.CDSAPI_KEY }}' }
        run: |
          if [ -z "$CDSAPI_KEY" ]; then echo "::error::Repository secret CDSAPI_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDSAPI_KEY" > ~/.cdsapirc; chmod 600 ~/.cdsapirc
      - run: pip install cdsapi netCDF4 numpy scipy
      - name: Fetch years one by one (commit each), stop before the time limit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 290*60 ))
          mkdir -p data/papers/1982/era5_years
          echo "started $(date -u)" > data/papers/1982/era5_years/progress.txt
          for y in $(seq 1979 2001); do
            f=data/papers/1982/era5_years/era5_$y.npz
            [ -f "$f" ] && continue
            [ $(date +%s) -gt $end ] && { echo "time budget used; stopping before $y"; break; }
            if timeout $(( end - $(date +%s) + 60 ))s python3 tools/era5/fetch_band.py $y $y --one; then
              echo "$y stored $(date -u +%FT%TZ)" >> data/papers/1982/era5_years/progress.txt
              git add "$f" data/papers/1982/era5_years/progress.txt; git commit -qm "ERA5 band means $y"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep $((i*15)); done
            else
              echo "$y failed or timed out $(date -u +%FT%TZ)" >> data/papers/1982/era5_years/progress.txt
            fi
          done
      - name: Assemble and re-test, or continue in a new run
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          rm -f ~/.cdsapirc
          git pull -q --rebase -X theirs origin main || true
          if python3 tools/era5/fetch_band.py 1979 2001; then
            python3 tools/papers/wwb_era5_1982.py
            git add data/papers/1982/era5_band_1979_2001.npz data/papers/1982/era5_wwb.json
            git commit -qm "ERA5 equatorial winds 1979-2001 and WWB re-test" || true
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*15)); done; exit 1
          else
            git add data/papers/1982/era5_years/progress.txt; git commit -qm "ERA5 progress" || true
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main || true
            echo "Years missing; dispatching a new run"; gh workflow run era5.yml --ref main
          fi
